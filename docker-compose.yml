services:
  mysqldb:
    image: mysql:8.4.0
    container_name: logitrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shipment_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logitrack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  shipment-service:
    build:
      context: src/main/java/ar/edu/unju/fi/arquitecturas/shipmentservice
      dockerfile: Dockerfile
    container_name: shipment-service
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysqldb:3306/shipment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - logitrack-net

networks:
  logitrack-net:
    driver: bridge

volumes:
  mysql_data: