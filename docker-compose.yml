services:
  mysqldb:
    image: mysql:8.4.0
    container_name: logitrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shipment_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logitrack-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  shipment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipment-service
    restart: on-failure
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      # Le indica al contenedor cómo llegar al Config Server que corre en Windows
      SPRING_CONFIG_IMPORT: "optional:configserver:http://host.docker.internal:8085"
    ports:
      - "8080:8080"
    networks:
      - logitrack-net

networks:
  logitrack-net:
    driver: bridge

volumes:
  mysql_data: